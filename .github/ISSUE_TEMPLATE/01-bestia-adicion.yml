# Tarjeta 1 — aporte a una ficha que ya existe.
#
# Los checkboxes de sección son GUÍA, no reja: le dicen al contribuidor a qué
# parte de la ficha va a parar lo que escribió, y le dan al generador un blanco
# al cual anexar. Nadie tiene que acertarle — el relato manda sobre las marcas.
#
# CONTRATO DE PARSEO: el generador lee el cuerpo del issue por el TEXTO de cada
# "label", no por el "id". Cambiar el texto de una label rompe el parser.
# Tratarlas como nombres de variable.

name: Añadir a una bestia que ya está
description: Morfología, ecología, comportamiento, medidas — lo que sepas de un animal ya registrado.
title: "[bestia] "
labels: ["aporte", "tipo:bestia-adicion", "estado:nuevo"]

body:
  - type: markdown
    attributes:
      value: |
        Escribe de corrido, como se lo contarías a alguien. No hace falta que
        ordenes nada ni que uses palabras técnicas — de eso se encarga el archivo.

        Si algo no lo sabes, déjalo así. Un hueco declarado vale más que un relleno.

  - type: dropdown
    id: criatura
    attributes:
      label: ¿Cuál criatura?
      description: >-
        ¿No está en la lista? Entonces la tarjeta que buscas es
        "Una bestia que no está registrada".
      options:
        - Cervato de Concreto
        - Gusano de Asfalto
        - Roca
        - Roca Negra
        - Cucaracha Matriarca
        - Chacal de Feria
        - Araña Hidráulica
        - Araña de Casa
        - Mosca Forúnculo
        - Hormiga Coordinadora
        - Coyote Mutado
        - Enredadera Acelerada
        - Hongo de Cemento
    validations:
      required: true

  - type: checkboxes
    id: secciones
    attributes:
      label: ¿De qué parte sabes algo?
      description: >-
        Marca las que apliquen. Es para saber a qué parte de la ficha mandar lo que
        escribas — si le atinas a medias no pasa nada, el texto manda sobre las marcas.
      options:
        - label: Cómo es por fuera — tamaño, color, partes del cuerpo
        - label: Cuánto mide o cuánto pesa
        - label: Dónde vive y de qué — dónde la has visto, qué come, qué se la come
        - label: Cómo se porta — si caza sola o en bola, a qué hora sale
        - label: Cómo saber que está cerca antes de verla — ruido, olor, rastro
        - label: Qué hacer si te la topas — qué funciona y qué se paga caro

  - type: textarea
    id: relato
    attributes:
      label: Cuéntame
      description: >-
        Si puedes, dime qué la delata antes de verla, qué error se paga caro,
        cuánto mide, dónde vive, qué come y qué se la come.
      placeholder: |
        La vi tres veces en el arroyo de atrás de la secundaria, siempre como a las
        seis de la tarde. Huele a fierro mojado antes de que la veas — eso es lo que
        te salva. Es del tamaño de un perro grande pero se mueve como si le pesara
        la cabeza, y cuando se para hace un ruido de agua adentro.

        Una vez se llevó un gato y no le tronó los huesos: se lo tragó entero.

        El error caro es acercarse por el lado del agua. Ahí no te oye venir, pero
        tampoco la oyes tú.
    validations:
      required: true

  - type: textarea
    id: inaccesible
    attributes:
      label: ¿Qué no se puede saber de ella, y por qué?
      description: >-
        Opcional. Algo que nadie ha podido averiguar, y la razón. No es un hueco:
        decir por qué no se puede saber también dice algo del animal.
      placeholder: |
        Nadie ha visto dónde duerme. La única vez que seguimos el rastro se metió al
        colector de la avenida, y ahí ya no entra nadie desde el invierno.

  - type: textarea
    id: inventado
    attributes:
      label: ¿Qué te inventaste?
      description: >-
        Sin problema si inventaste — nomás dilo. Lo que marques aquí se revisa aparte
        antes de entrar al archivo.
      placeholder: |
        El nombre me lo saqué de la manga. Lo del olor a fierro sí es real; lo de que
        cazan en pareja es suposición mía, porque siempre vi dos.

  - type: markdown
    attributes:
      value: |
        ---
        **Qué pasa con esto**

        Entra a la ficha de la criatura que escogiste, en las pestañas que marcaste
        arriba. **Nada se sobrescribe**: lo tuyo se anexa a lo que ya está.

        No se publica solo. Sale como propuesta de cambio, alguien la revisa y la
        acepta, la ajusta o la rechaza. Si algo de lo tuyo no encaja con el archivo,
        se dice y ya.
