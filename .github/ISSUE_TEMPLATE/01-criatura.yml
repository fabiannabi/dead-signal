# Tarjeta 1 — el embudo. Absorbe protocolo, hipótesis, ecología, medidas,
# morfología, criatura nueva y todo lo que no sepas dónde poner.
#
# CONTRATO DE PARSEO: el generador lee el cuerpo del issue por el TEXTO de cada
# "label", no por el "id". Cambiar el texto de una label rompe el parser.
# Tratarlas como nombres de variable.

name: Sé algo de una criatura
description: Lo que viste, oíste o dedujiste de un animal del archivo — o de uno que no está en la lista.
title: "[criatura] "
labels: ["aporte", "tipo:criatura", "estado:nuevo"]

body:
  - type: markdown
    attributes:
      value: |
        Escribe de corrido, como se lo contarías a alguien. No hace falta que
        ordenes nada ni que uses palabras técnicas — de eso se encarga el archivo.

        Si algo no lo sabes, déjalo así. Un hueco declarado vale más que un relleno.

  - type: dropdown
    id: criatura
    attributes:
      label: ¿Cuál criatura?
      description: Si lo tuyo es un animal que todavía no está registrado, escoge la última opción.
      options:
        - Cervato de Concreto
        - Gusano de Asfalto
        - Roca
        - Roca Negra
        - Cucaracha Matriarca
        - Chacal de Feria
        - Araña Hidráulica
        - Araña de Casa
        - Mosca Forúnculo
        - Hormiga Coordinadora
        - Coyote Mutado
        - Enredadera Acelerada
        - Hongo de Cemento
        - Una que no está en la lista
    validations:
      required: true

  - type: input
    id: nombre
    attributes:
      label: ¿Cómo se llama?
      description: >-
        Solo si escogiste "una que no está en la lista". El nombre que le pusieron
        quienes la vieron, no uno científico.
      placeholder: La sierra, el trapero, cosa de la presa…

  - type: textarea
    id: relato
    attributes:
      label: Cuéntame
      description: >-
        Si puedes, dime qué la delata antes de verla, qué error se paga caro,
        cuánto mide, dónde vive, qué come y qué se la come.
      placeholder: |
        La vi tres veces en el arroyo de atrás de la secundaria, siempre como a las
        seis de la tarde. Huele a fierro mojado antes de que la veas — eso es lo que
        te salva. Es del tamaño de un perro grande pero se mueve como si le pesara
        la cabeza, y cuando se para hace un ruido de agua adentro.

        Una vez se llevó un gato y no le tronó los huesos: se lo tragó entero.

        El error caro es acercarse por el lado del agua. Ahí no te oye venir, pero
        tampoco la oyes tú.
    validations:
      required: true

  - type: dropdown
    id: peligro
    attributes:
      label: ¿Qué tan peligrosa es?
      description: Solo si es una criatura nueva. Si dudas, escoge la de arriba.
      options:
        - Te puede lastimar
        - Te puede matar

  - type: dropdown
    id: comida
    attributes:
      label: ¿Qué come?
      description: Solo si es una criatura nueva.
      options:
        - Plantas
        - Carne
        - Vive de otro animal
        - Restos

  - type: textarea
    id: inaccesible
    attributes:
      label: ¿Qué no se puede saber de ella, y por qué?
      description: >-
        Algo que nadie ha podido averiguar, y la razón. No es un hueco: decir por qué
        no se puede saber también dice algo del animal.
      placeholder: |
        Nadie ha visto dónde duerme. La única vez que seguimos el rastro se metió al
        colector de la avenida, y ahí ya no entra nadie desde el invierno.
    validations:
      required: true

  - type: textarea
    id: inventado
    attributes:
      label: ¿Qué te inventaste?
      description: >-
        Sin problema si inventaste — nomás dilo. Lo que marques aquí se revisa aparte
        antes de entrar al archivo.
      placeholder: |
        El nombre me lo saqué de la manga. Lo del olor a fierro sí es real; lo de que
        cazan en pareja es suposición mía, porque siempre vi dos.
