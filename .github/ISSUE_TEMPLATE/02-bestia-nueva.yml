# Tarjeta 2 — criatura que todavía no está en el bestiario.
#
# GUARDIÁN EN EL CONTROL: el dropdown de peligro solo ofrece los equivalentes de
# amenaza I y II. III y IV no son seleccionables y el contribuidor nunca supo que
# existían. La traducción a vocabulario del índice la hace el script:
#   "Te puede lastimar" → amenaza-i    "Te puede matar" → amenaza-ii
#   Plantas → herbivoro · Carne → carnivoro · Vive de otro animal → parasito
#   Restos → descomponedor
#
# ATRIBUCIÓN: sale siempre con data-tags "sin-atribucion". No se atribuye a un
# sobreviviente nombrado, por eso no hay campo para decir quién la vio.
#
# El último campo reemplaza al viejo "¿qué te inventaste?": pregunta por FUENTE,
# no por confesión. Ver nota en 01-bestia-adicion.yml.
#
# CONTRATO DE PARSEO: el generador lee por el TEXTO de cada "label", no por el "id".

name: Una bestia que no está registrada
description: Un animal que no aparece en el bestiario. Entra como ficha nueva, en clasificación.
title: "[bestia nueva] "
labels: ["aporte", "tipo:bestia-nueva", "estado:nuevo"]

body:
  - type: markdown
    attributes:
      value: |
        Escribe de corrido, como se lo contarías a alguien. No hace falta que ordenes
        nada, que uses palabras técnicas ni que suene bien: el archivo reescribe todo
        a su registro. Lo que no puede hacer es inventar lo que tú viste.

        Si algo no lo sabes, déjalo así. Un hueco declarado vale más que un relleno.

  - type: input
    id: nombre
    attributes:
      label: ¿Cómo se llama?
      description: >-
        El nombre que le pusieron quienes la vieron, no uno científico ni de catálogo.
        Así se llaman todas en el archivo: la Roca, el Cervato de Concreto, la Mosca
        Forúnculo. Si nadie le ha puesto nombre, descríbela en dos palabras y ya.
      placeholder: La sierra, el trapero, cosa de la presa…
    validations:
      required: true

  - type: textarea
    id: relato
    attributes:
      label: Cuéntame
      description: >-
        Lo más útil no son los datos duros: es qué la delata antes de verla, qué error
        se paga caro, cómo se mueve, a qué hora sale. Si además sabes cuánto mide,
        dónde vive, qué come y qué se la come, mejor — pero con lo primero basta.
      placeholder: |
        La vi tres veces en el arroyo de atrás de la secundaria, siempre como a las
        seis de la tarde. Huele a fierro mojado antes de que la veas — eso es lo que
        te salva. Es del tamaño de un perro grande pero se mueve como si le pesara
        la cabeza, y cuando se para hace un ruido de agua adentro.

        Una vez se llevó un gato y no le tronó los huesos: se lo tragó entero.

        El error caro es acercarse por el lado del agua. Ahí no te oye venir, pero
        tampoco la oyes tú.
    validations:
      required: true

  - type: dropdown
    id: peligro
    attributes:
      label: ¿Qué tan peligrosa es?
      description: >-
        De esto sale el nivel de amenaza de la ficha y el color de su tarjeta en el
        índice. Si dudas, escoge la primera: subir de nivel después es fácil, bajarlo
        deja el expediente raro.
      options:
        - Te puede lastimar
        - Te puede matar
    validations:
      required: true

  - type: dropdown
    id: comida
    attributes:
      label: ¿Qué come?
      description: >-
        De esto sale su lugar en la red trófica y el filtro por el que la va a
        encontrar la gente. "Vive de otro animal" es para las que se le montan a algo
        vivo sin matarlo de inmediato.
      options:
        - Plantas
        - Carne
        - Vive de otro animal
        - Restos
    validations:
      required: true

  - type: textarea
    id: inaccesible
    attributes:
      label: ¿Qué no se puede saber de ella, y por qué?
      description: >-
        El archivo trata los huecos como dato: no es lo mismo "nadie lo ha medido" que
        "quien fue a medirlo no volvió". Una ficha sin huecos declarados se lee como
        inventada — este campo es el que la hace creíble.
      placeholder: |
        Nadie ha visto dónde duerme. La única vez que seguimos el rastro se metió al
        colector de la avenida, y ahí ya no entra nadie desde el invierno.
    validations:
      required: true

  - type: textarea
    id: fuente
    attributes:
      label: ¿Qué te consta y qué estás suponiendo?
      description: >-
        Separa lo que viste tú de lo que dedujiste o te contaron. Las dos cosas entran:
        lo observado como dato, lo supuesto como hipótesis abierta con tu nombre encima.
        Nada se tira por ser suposición — lo único que rompe una ficha es no saber cuál
        es cuál.
      placeholder: |
        Me consta el olor a fierro y que se llevó al gato: eso lo vi yo.

        Que cazan en pareja es suposición mía, nomás porque siempre vi dos juntas.
        Lo del ruido de agua adentro me lo contó otra persona, yo no se lo oí.

  - type: markdown
    attributes:
      value: |
        ---
        **Qué pasa con esto**

        Se abre una ficha nueva en el bestiario y una tarjeta en el índice. Sale
        marcada **"en clasificación"** y **sin atribuir a nadie** — así arrancan
        todas las entradas que no vienen de un sobreviviente del archivo.

        Nace incompleta a propósito: las pestañas que nadie ha podido llenar salen
        declaradas como huecos, no rellenadas a la brava. Se va completando conforme
        llegue más material sobre ella.

        No se publica sola. Sale como propuesta de cambio, alguien la revisa y la
        acepta, la ajusta o la rechaza.
