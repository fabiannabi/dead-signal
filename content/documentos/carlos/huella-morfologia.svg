<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Caveat, cursive">

  <rect width="680" height="470" fill="#e4edf8"/>
  <g stroke="#a4bcd6" stroke-width="0.7" opacity="0.65">
    <line x1="0" y1="24"  x2="680" y2="24"/><line x1="0" y1="48"  x2="680" y2="48"/>
    <line x1="0" y1="72"  x2="680" y2="72"/><line x1="0" y1="96"  x2="680" y2="96"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="144" x2="680" y2="144"/>
    <line x1="0" y1="168" x2="680" y2="168"/><line x1="0" y1="192" x2="680" y2="192"/>
    <line x1="0" y1="216" x2="680" y2="216"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="264" x2="680" y2="264"/><line x1="0" y1="288" x2="680" y2="288"/>
    <line x1="0" y1="312" x2="680" y2="312"/><line x1="0" y1="336" x2="680" y2="336"/>
    <line x1="0" y1="360" x2="680" y2="360"/><line x1="0" y1="384" x2="680" y2="384"/>
    <line x1="0" y1="408" x2="680" y2="408"/><line x1="0" y1="432" x2="680" y2="432"/>
    <line x1="0" y1="456" x2="680" y2="456"/>
  </g>
  <line x1="56" y1="0" x2="56" y2="470" stroke="#c89898" stroke-width="1" opacity="0.7"/>

  <!-- Título -->
  <text x="68" y="34" font-size="18" fill="#1a2a3a" font-weight="500">huella — campo norte / 15 m de barda</text>
  <text x="68" y="54" font-size="13" fill="#4a6080">trazado directo sobre terreno — 9:14h aprox.</text>
  <text x="580" y="54" font-size="11" fill="#8a3018" transform="rotate(1.5,580,54)">sin referencia conocida</text>

  <!-- ═══════════════════════ HUELLA PRINCIPAL ═══════════════════════ -->
  <!-- Palma / almohadilla central -->
  <ellipse cx="210" cy="230" rx="54" ry="48" fill="white" fill-opacity="0.5" stroke="#1a2a3a" stroke-width="2.2"/>

  <!-- Dedo 1 — izquierdo, inclinado izq -->
  <ellipse cx="163" cy="155" rx="19" ry="34" transform="rotate(-18,163,155)" fill="white" fill-opacity="0.4" stroke="#1a2a3a" stroke-width="2"/>
  <!-- Garra 1 -->
  <path d="M 152,128 Q 149,116 146,110" fill="none" stroke="#1a2a3a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Dedo 2 — centro-izquierdo -->
  <ellipse cx="196" cy="143" rx="19" ry="36" transform="rotate(-5,196,143)" fill="white" fill-opacity="0.4" stroke="#1a2a3a" stroke-width="2"/>
  <!-- Garra 2 -->
  <path d="M 193,112 Q 192,100 191,93" fill="none" stroke="#1a2a3a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Dedo 3 — derecho -->
  <ellipse cx="232" cy="150" rx="19" ry="34" transform="rotate(16,232,150)" fill="white" fill-opacity="0.4" stroke="#1a2a3a" stroke-width="2"/>
  <!-- Garra 3 -->
  <path d="M 244,122 Q 248,110 251,104" fill="none" stroke="#1a2a3a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Dedo posterior — hacia abajo -->
  <ellipse cx="210" cy="288" rx="15" ry="26" fill="white" fill-opacity="0.4" stroke="#1a2a3a" stroke-width="2"/>
  <!-- Garra posterior -->
  <path d="M 210,310 Q 210,320 210,326" fill="none" stroke="#1a2a3a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ═══════════════════════ MEDIDAS ═══════════════════════ -->
  <!-- Longitud total (vertical) -->
  <line x1="278" y1="93" x2="278" y2="326" stroke="#2a4060" stroke-width="1"/>
  <line x1="274" y1="93"  x2="282" y2="93"  stroke="#2a4060" stroke-width="1"/>
  <line x1="274" y1="326" x2="282" y2="326" stroke="#2a4060" stroke-width="1"/>
  <text x="284" y="216" font-size="14" fill="#2a4060">22 cm</text>
  <text x="284" y="232" font-size="11" fill="#4a6080">largo total</text>

  <!-- Ancho (horizontal) -->
  <line x1="136" y1="338" x2="266" y2="338" stroke="#2a4060" stroke-width="1"/>
  <line x1="136" y1="334" x2="136" y2="342" stroke="#2a4060" stroke-width="1"/>
  <line x1="266" y1="334" x2="266" y2="342" stroke="#2a4060" stroke-width="1"/>
  <text x="201" y="354" font-size="13" fill="#2a4060" text-anchor="middle">16 cm</text>

  <!-- Separación dedos superiores -->
  <line x1="163" y1="128" x2="232" y2="128" stroke="#4a6080" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="197" y="122" font-size="11" fill="#4a6080" text-anchor="middle">separación: ~4.5 cm</text>

  <!-- Dedo posterior -->
  <line x1="140" y1="300" x2="198" y2="300" stroke="#4a6080" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="100" y="304" font-size="11" fill="#4a6080" text-anchor="end">d. posterior</text>

  <!-- Profundidad -->
  <text x="68" y="175" font-size="12" fill="#8a3018">prof. dedos:</text>
  <text x="68" y="190" font-size="14" fill="#8a3018" font-weight="500">4.1 cm</text>
  <text x="68" y="215" font-size="12" fill="#8a3018">prof. almohadilla:</text>
  <text x="68" y="230" font-size="14" fill="#8a3018" font-weight="500">3.2 cm</text>
  <!-- Pequeña flecha al suelo -->
  <line x1="90" y1="235" x2="90" y2="248" stroke="#8a3018" stroke-width="1"/>
  <polygon points="90,252 87,246 93,246" fill="#8a3018"/>

  <!-- ═══════════════════════ REFERENCIA PIE HUMANO ═══════════════════════ -->
  <text x="420" y="76" font-size="12" fill="#4a6080">ref: pie humano (27 cm)</text>
  <!-- Silueta pie humano — muy simple, mucho más pequeña -->
  <path d="M 450,250 Q 440,200 445,160 Q 450,130 460,125 Q 470,120 475,130 Q 480,145 472,185 Q 490,190 495,210 Q 500,230 488,250 Z" fill="white" fill-opacity="0.4" stroke="#4a6080" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="472" y="265" font-size="11" fill="#4a6080" text-anchor="middle">pie humano</text>
  <!-- Línea de escala relativa -->
  <line x1="430" y1="280" x2="510" y2="280" stroke="#4a6080" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="470" y="292" font-size="10" fill="#4a6080" text-anchor="middle">escala relativa ↑</text>

  <!-- Zancada -->
  <line x1="68" y1="370" x2="250" y2="370" stroke="#1a2a3a" stroke-width="1.2" stroke-dasharray="6,3"/>
  <polygon points="250,370 244,367 244,373" fill="#1a2a3a"/>
  <text x="68" y="388" font-size="13" fill="#1a2a3a">zancada medida: 181 cm</text>
  <text x="68" y="404" font-size="11" fill="#4a6080">(distancia entre dos impresiones consecutivas)</text>

  <!-- Nota final -->
  <line x1="68" y1="418" x2="632" y2="418" stroke="#a4bcd6" stroke-width="0.7" opacity="0.6"/>
  <text x="68" y="436" font-size="14" fill="#1a2a3a">→ morfología: 3 dedos ant. + 1 posterior — distinto a todo lo registrado</text>
  <text x="68" y="457" font-size="15" fill="#8a3018" font-weight="500">→ no es coyote. no es nada conocido.</text>

  <polygon points="652,0 680,0 680,28" fill="#c0ccd8" opacity="0.45"/>
  <text x="28" y="235" font-size="10" fill="#7a9ab8" text-anchor="middle" transform="rotate(-90,28,235)">HUELLA / MORFOLOGÍA</text>

</svg>
