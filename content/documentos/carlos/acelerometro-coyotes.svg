  <!-- ANOTACIONES gráfico principal -->
  <line x1="239" y1="72" x2="239" y2="66" stroke="#8a3018" stroke-width="1.2"/>
  <line x1="239" y1="66" x2="340" y2="66" stroke="#8a3018" stroke-width="1.2"/>
