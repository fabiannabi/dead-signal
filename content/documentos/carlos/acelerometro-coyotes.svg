  <line x1="120" y1="219" x2="120" y2="227" stroke="#2a4060" stroke-width="1"/>
  <line x1="350" y1="219" x2="350" y2="227" stroke="#2a4060" stroke-width="1"/>
  <text x="235" y="238" font-size="12" fill="#2a4060" text-anchor="middle">~4 min 10 seg</text>

  <!-- SEPARADOR entre gráficos -->
