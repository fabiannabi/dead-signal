  <line x1="307" y1="278" x2="307" y2="272" stroke="#8a3018" stroke-width="1.2"/>
  <line x1="307" y1="272" x2="390" y2="272" stroke="#8a3018" stroke-width="1.2"/>
  <text x="393" y="277" font-size="12" fill="#8a3018">firma única — sin continuidad</text>
  <text x="393" y="291" font-size="11" fill="#8a3018">origen sin clasificar   ?</text>

  <!-- SEPARADOR notas -->
  <line x1="68" y1="360" x2="632" y2="360" stroke="#a4bcd6" stroke-width="0.7" opacity="0.65"/>

  <!-- NOTAS -->
  <text x="68" y="379" font-size="14" fill="#1a2a3a">→ coyotes mutados: 7 ind. / formación semicírculo / barda sur resistió</text>
  <text x="68" y="401" font-size="14" fill="#1a2a3a">→ vel. estimada alta, masa media — distintos a B1 en frec. y patrón</text>
  <text x="68" y="423" font-size="14" fill="#8a3018" font-weight="500">→ 04:15h sensor N: registro único. no fue piedra. algo se detuvo.</text>
  <text x="68" y="447" font-size="14" fill="#8a3018" font-weight="500">→ barda norte intacta. lo que entró no la necesitó.</text>

  <!-- Esquina doblada -->
  <polygon points="652,0 680,0 680,28" fill="#c0ccd8" opacity="0.45"/>

  <text x="28" y="175" font-size="10" fill="#7a9ab8" text-anchor="middle" transform="rotate(-90,28,175)">SENSOR ARRAY / ALERTA</text>

</svg>
