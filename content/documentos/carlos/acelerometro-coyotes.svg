  <text x="68" y="268" font-size="12" fill="#4a6080">sensor N — registro aislado / 04:15h (noche previa)</text>

  <!-- GRÁFICO SECUNDARIO: pulso misterioso 4:15h -->
  <rect x="68" y="274" width="564" height="72" fill="white" fill-opacity="0.3" stroke="#2a4060" stroke-width="1" stroke-dasharray="4,2"/>

  <line x1="68" y1="310" x2="632" y2="310" stroke="#b8cce0" stroke-width="0.5"/>
  <text x="54" y="313" font-size="10" fill="#4a6080" text-anchor="end">0</text>

