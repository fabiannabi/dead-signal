<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Caveat, cursive">

  <rect width="680" height="420" fill="#e2ecf6"/>

  <g stroke="#a4bcd6" stroke-width="0.7" opacity="0.65">
    <line x1="0" y1="24"  x2="680" y2="24"/>
    <line x1="0" y1="48"  x2="680" y2="48"/>
    <line x1="0" y1="72"  x2="680" y2="72"/>
    <line x1="0" y1="96"  x2="680" y2="96"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="144" x2="680" y2="144"/>
    <line x1="0" y1="168" x2="680" y2="168"/>
    <line x1="0" y1="192" x2="680" y2="192"/>
    <line x1="0" y1="216" x2="680" y2="216"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="264" x2="680" y2="264"/>
    <line x1="0" y1="288" x2="680" y2="288"/>
    <line x1="0" y1="312" x2="680" y2="312"/>
    <line x1="0" y1="336" x2="680" y2="336"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="384" x2="680" y2="384"/>
  </g>

  <line x1="56" y1="0" x2="56" y2="420" stroke="#c89898" stroke-width="1" opacity="0.7"/>

  <!-- Título — algo inclinado, escrito a prisa -->
  <text x="68" y="33" font-size="18" fill="#1a2a3a" font-weight="500" transform="rotate(-0.5,68,33)">acelerómetro portátil — firma sin clasificar</text>
  <text x="68" y="54" font-size="13" fill="#4a6080">en tránsito — av. central / ~9h aprox.</text>
  <!-- Nota al margen -->
  <text x="560" y="54" font-size="11" fill="#8a3018" transform="rotate(2,560,54)">reconstruido de memoria</text>

  <!-- Área del gráfico -->
  <rect x="68" y="66" width="564" height="178" fill="white" fill-opacity="0.4" stroke="#2a4060" stroke-width="1.5"/>

  <g stroke="#b8cce0" stroke-width="0.5">
    <line x1="68"  y1="107" x2="632" y2="107"/>
    <line x1="68"  y1="155" x2="632" y2="155"/>
    <line x1="68"  y1="203" x2="632" y2="203"/>
    <line x1="200" y1="66"  x2="200" y2="244"/>
    <line x1="332" y1="66"  x2="332" y2="244"/>
    <line x1="464" y1="66"  x2="464" y2="244"/>
  </g>

  <text x="54" y="111" font-size="11" fill="#4a6080" text-anchor="end">+</text>
  <text x="54" y="159" font-size="11" fill="#4a6080" text-anchor="end">0</text>
  <text x="54" y="207" font-size="11" fill="#4a6080" text-anchor="end">−</text>
  <text x="630" y="256" font-size="12" fill="#4a6080" text-anchor="end">tiempo →</text>

  <!-- FASE 1: conduciendo normal — vibración baja irregular de motor/carretera -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="68,155 72,153 76,157 80,154 84,156 88,153 92,157 96,154 100,156 104,153 108,157 112,154 116,156 120,153 124,157 128,154 132,156 136,153 140,157 144,155 148,153 152,156 156,154 160,157 164,154 168,156 172,153"/>

  <!-- FASE 2: firma emergiendo — sinusoidal lenta, frecuencia baja, amplitud creciendo -->
  <!-- ~0.8 Hz = un ciclo cada 1.25s. Representado con ondas de ~28px cada una -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="172,153 176,151 180,147 184,143 188,139 192,143 196,148 200,153 204,151 208,145 212,138 216,133 220,138 224,145 228,153"/>
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="228,153 232,149 236,140 240,130 244,122 248,115 252,122 256,132 260,142 264,151 268,155"/>
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="268,155 272,148 276,134 280,116 284,100 288,88 292,100 296,116 300,134 304,150 308,157"/>

  <!-- FASE 3: pico máximo — amplitud saturando (clipping visual en tope e inferior) -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="2" stroke-linejoin="round"
    points="308,157 311,140 314,116 317,88 320,72 323,68 326,68 329,68 332,72 335,88 338,112 341,140 344,158"/>
  <!-- lado negativo del pico (espejo hacia abajo, clipeado) -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="2" stroke-linejoin="round"
    points="344,158 347,174 350,198 353,224 356,240 359,244 362,244 365,244 368,240 371,224 374,200 377,176 380,157"/>

  <!-- Líneas de clip (indicadores de saturación) -->
  <line x1="315" y1="68" x2="343" y2="68" stroke="#8a3018" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="348" y1="244" x2="376" y2="244" stroke="#8a3018" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- FASE 4: corte abrupto — el Gusano vuelve al subsuelo -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="380,157 382,155 384,155 386,155 388,154 390,155"/>

  <!-- FASE 5: silencio total breve -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="390,155 400,155 410,155 420,155"/>

  <!-- FASE 6: vibración de carretera reanuda (más lenta — Carlos redujo velocidad) -->
  <polyline fill="none" stroke="#1a3a5a" stroke-width="1.6" stroke-linejoin="round"
    points="420,155 424,153 428,157 432,154 436,156 440,154 444,157 448,154 452,156 456,153 460,156 464,154 468,157 472,154 476,156 480,153 484,156 488,154 492,157 496,154 500,156 504,153 508,157 512,154 516,156 520,154 524,157 528,154 532,156 536,153 540,156 544,154 548,157 552,154 556,156 560,153 564,155 568,154 572,156 576,153 580,155 584,154 588,156 592,153 596,155 600,154 604,156 608,153 612,155 616,154 620,156 624,153 628,155 632,155"/>

  <!-- ANOTACIONES -->
  <!-- Flecha a pico máximo -->
  <line x1="332" y1="66" x2="332" y2="60" stroke="#8a3018" stroke-width="1.3"/>
  <line x1="332" y1="60" x2="440" y2="60" stroke="#8a3018" stroke-width="1.3"/>
  <circle cx="332" cy="68" r="2.5" fill="#8a3018"/>
  <text x="443" y="65" font-size="13" fill="#8a3018">pico máx — ampli. &#62;&#62; B1</text>

  <!-- Anotación clip superior -->
  <text x="345" y="80" font-size="10" fill="#8a3018">↑ saturado</text>
  <!-- Anotación clip inferior -->
  <text x="348" y="258" font-size="10" fill="#8a3018">↓ saturado</text>

  <!-- Anotación frecuencia -->
  <!-- Corchete de un ciclo completo (fase 2, onda grande) -->
  <line x1="268" y1="230" x2="308" y2="230" stroke="#2a4060" stroke-width="1"/>
  <line x1="268" y1="226" x2="268" y2="234" stroke="#2a4060" stroke-width="1"/>
  <line x1="308" y1="226" x2="308" y2="234" stroke="#2a4060" stroke-width="1"/>
  <text x="288" y="246" font-size="11" fill="#2a4060" text-anchor="middle">~1 ciclo</text>
  <text x="288" y="259" font-size="10" fill="#2a4060" text-anchor="middle">frec. baja</text>

  <!-- Corte abrupto -->
  <line x1="385" y1="125" x2="385" y2="260" stroke="#4a6080" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="390" y="270" font-size="12" fill="#4a6080">corte</text>

  <!-- Etiquetas fases -->
  <text x="100" y="82" font-size="11" fill="#4a6080">conduciendo</text>
  <text x="200" y="82" font-size="11" fill="#4a6080">firma emergiendo →</text>
  <text x="492" y="82" font-size="11" fill="#4a6080">vel. reducida</text>

  <!-- SEPARADOR notas -->
  <line x1="68" y1="274" x2="632" y2="274" stroke="#a4bcd6" stroke-width="0.7" opacity="0.65"/>

  <!-- NOTAS — más apresuradas, con tachadura -->
  <text x="68" y="293" font-size="14" fill="#1a2a3a">→ firma contínua sinusoidal — NO discreta como B1. frec. ~0.8 Hz.</text>

  <!-- Tachadura en cálculo erróneo -->
  <text x="68" y="315" font-size="14" fill="#4a6080">→ masa estimada: ×</text>
  <line x1="68" y1="313" x2="235" y2="313" stroke="#4a6080" stroke-width="1.5"/>
  <text x="240" y="315" font-size="14" fill="#1a2a3a">amplitud 6× sobre ref. B1. enorme.</text>

  <text x="68" y="337" font-size="14" fill="#1a2a3a">→ subterráneo. el asfalto cedió DESPUÉS del paso. no antes.</text>
  <text x="68" y="359" font-size="14" fill="#8a3018" font-weight="500">→ regla: firma similar = detener / rodear. no seguir sobre pavim. deteriorado.</text>
  <text x="68" y="381" font-size="13" fill="#4a6080" transform="rotate(-0.8,68,381)">   (demasiado tarde para esta vez)</text>

  <!-- Esquina doblada -->
  <polygon points="652,0 680,0 680,28" fill="#c0ccd8" opacity="0.45"/>

  <text x="28" y="168" font-size="10" fill="#7a9ab8" text-anchor="middle" transform="rotate(-90,28,168)">SENSOR P / TRÁNSITO</text>

</svg>
