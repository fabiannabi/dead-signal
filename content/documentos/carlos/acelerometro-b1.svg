  <!-- NOTAS AL PIE -->
  <text x="68" y="317" font-size="14" fill="#1a2a3a">→ locomoción cuadrúpeda — paso regular, sin variación en intervalo</text>
  <text x="68" y="341" font-size="14" fill="#1a2a3a">→ amplitud: 2.8× referencia herbívoro grande (días 1–3). diferencia significativa.</text>
  <text x="68" y="365" font-size="14" fill="#1a2a3a">→ ruta bordeando norte del campus, ~30 m de barda. no entró.</text>
  <text x="68" y="389" font-size="14" fill="#8a3018" font-weight="500">→ dos rutas documentadas — semanas distintas, horarios distintos.</text>
  <text x="68" y="413" font-size="15" fill="#8a3018" font-weight="600">    B1 está aprendiendo el campus?</text>

