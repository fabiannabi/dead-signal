  <line x1="282" y1="62" x2="456" y2="62" stroke="#8a3018" stroke-width="1.3"/>
  <circle cx="282" cy="76" r="2.5" fill="#8a3018"/>
  <text x="458" y="67" font-size="13" fill="#8a3018">B1 — 4.2 Hz aprox.</text>
  <text x="458" y="82" font-size="11" fill="#8a3018">amp. alta / masa considerable</text>

  <!-- ANOTACIÓN 2: corchete intervalo -->
  <line x1="206" y1="232" x2="206" y2="226" stroke="#2a4060" stroke-width="1.1"/>
  <line x1="206" y1="229" x2="259" y2="229" stroke="#2a4060" stroke-width="1.1"/>
